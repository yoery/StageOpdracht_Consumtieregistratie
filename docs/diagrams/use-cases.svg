<text x="870" y="330.5" text-anchor="middle" font-size="13.5">Zelfde als</text>
<text x="870" y="349.5" text-anchor="middle" font-size="13.5">vorige keer</text>
<ellipse class="box" cx="410" cy="460" rx="118" ry="34" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
