<text x="652" y="474.5" text-anchor="middle" font-size="14.5">instellen (demo)</text>
<ellipse class="box" cx="894" cy="460" rx="118" ry="34" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
