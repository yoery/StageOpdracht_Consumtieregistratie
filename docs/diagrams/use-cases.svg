<ellipse class="box" cx="520" cy="1030" rx="175" ry="34" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
<text x="520" y="1025.5" text-anchor="middle" font-size="14.5">UC-19 Wijzigingen uit een</text>
<text x="520" y="1044.5" text-anchor="middle" font-size="14.5">ander tabblad overnemen</text>
