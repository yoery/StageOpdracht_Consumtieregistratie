<text x="410" y="474.5" text-anchor="middle" font-size="14.5">met de camera (demo)</text>
<ellipse class="box" cx="652" cy="460" rx="118" ry="34" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
