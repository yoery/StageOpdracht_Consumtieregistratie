<text x="894" y="474.5" text-anchor="middle" font-size="14.5">uitzetten (demo)</text>
<!-- Use cases van het systeem -->
<ellipse class="box" cx="520" cy="940" rx="175" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
