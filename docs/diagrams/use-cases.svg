<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1200" viewBox="0 0 1850 1200" role="img" aria-labelledby="title desc">
  <title id="title">Use-casediagram Blikjesregistratie TVB</title>
  <desc id="desc">Use cases UC-01 tot en met UC-23 uit hoofdstuk 10: Medewerker UC-01 tot en met UC-06 en UC-20 tot en met UC-22, Beheerder UC-06 tot en met UC-17 en UC-23, Systeem UC-18 en UC-19. UC-03, UC-04, UC-05 en UC-20 breiden UC-02 uit, UC-20 breidt ook UC-21 uit, UC-22 bevat UC-04 en UC-23 breidt UC-10 uit.</desc>
  <defs>
    <style>
      text { font-family: "DM Sans", sans-serif; fill: #163540; }
      .kop { font-family: "Space Grotesk", "DM Sans", sans-serif; font-weight: 700; }
      .sub { fill: #71858a; }
      .lbl { font-size: 13.5px; fill: #71858a; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .lijn { fill: none; stroke: #163540; stroke-width: 1.6; }
      .stip { fill: none; stroke: #163540; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
    <!-- gevulde pijlpunt (aanroep, gegevensstroom) -->
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#163540"/>
    </marker>
    <!-- open pijlpunt (UML: associatie en afhankelijkheid) -->
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#163540" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1850" height="1200" fill="#ffffff"/>
<text x="40" y="50" font-size="28" class="kop">Use-casediagram – Blikjesregistratie TVB</text>
<text x="40" y="78" font-size="15" class="sub">De use cases UC-01 t/m UC-23 uit hoofdstuk 10 met hun actoren</text>
<rect x="270" y="105" width="1370" height="1060" rx="18" fill="#f8fbfa" stroke="#159a72" stroke-width="1.8"/>
<text x="292" y="138" font-size="18" fill="#087252" class="kop">Blikjesregistratie TVB</text>
<!-- Actoren -->
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="110" cy="573" r="13" fill="#e8f5ee"/>
    <path d="M110,586 V622 M86,598 H134 M110,622 L92,650 M110,622 L128,650"/>
  </g>
  <text x="110" y="674" text-anchor="middle" font-size="16" class="kop">Medewerker</text>
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="1765" cy="613" r="13" fill="#e8f5ee"/>
    <path d="M1765,626 V662 M1741,638 H1789 M1765,662 L1747,690 M1765,662 L1783,690"/>
  </g>
  <text x="1765" y="714" text-anchor="middle" font-size="16" class="kop">Beheerder</text>
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="110" cy="893" r="13" fill="#e8f5ee"/>
    <path d="M110,906 V942 M86,918 H134 M110,942 L92,970 M110,942 L128,970"/>
  </g>
  <text x="110" y="994" text-anchor="middle" font-size="16" class="kop">Systeem</text>
<text x="110" y="1013" text-anchor="middle" font-size="13" class="sub">(tijd, ander tabblad)</text>
<!-- Use cases van de medewerker -->
<ellipse class="box" cx="520" cy="250" rx="150" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
