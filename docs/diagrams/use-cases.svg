<ellipse class="box" cx="1200" cy="760" rx="175" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
<text x="1200" y="765" text-anchor="middle" font-size="14.5">UC-14 Voorraad bijhouden</text>
<ellipse class="box" cx="1200" cy="840" rx="175" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
<text x="1200" y="845" text-anchor="middle" font-size="14.5">UC-15 CSV-export maken</text>
<ellipse class="box" cx="1200" cy="920" rx="175" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
<text x="1200" y="925" text-anchor="middle" font-size="14.5">UC-16 Logboek bekijken</text>
<ellipse class="box" cx="1200" cy="1000" rx="175" ry="27" fill="#ffffff" stroke="#159a72" stroke-width="1.8"/>
<text x="1200" y="1005" text-anchor="middle" font-size="14.5">UC-17 Alle gegevens wissen</text>
<ellipse class="box" cx="1200" cy="1080" rx="175" ry="27" fill="#e8f5ee" stroke="#159a72" stroke-width="1.8"/>
<text x="1200" y="1085" text-anchor="middle" font-size="14.5">UC-06 Thema wisselen</text>
<ellipse class="box" cx="880" cy="240" rx="95" ry="34" fill="#ffffff" stroke="#71858a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="880" y="235.5" text-anchor="middle" font-size="13.5">Datum kiezen</text>
<text x="880" y="254.5" text-anchor="middle" font-size="13.5">bij +</text>
