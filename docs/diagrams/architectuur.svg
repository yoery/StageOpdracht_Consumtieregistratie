<text x="1017" y="293" class="lbl">zet data-theme</text>
<path d="M700,272 L700,452" class="lijn" marker-end="url(#pijl)"/>
<text x="712" y="352" class="lbl">klik, toets,</text>
<text x="712" y="369" class="lbl">formulier</text>
<path d="M445,454 L445,414" class="lijn" marker-end="url(#pijl)"/>
<text x="457" y="438" class="lbl">render…()</text>
<path d="M395,554 L395,594" class="lijn" marker-end="url(#pijl)"/>
<text x="407" y="578" class="lbl">wijzigt en leest</text>
<path d="M760,554 L760,594" class="lijn" marker-end="url(#pijl)"/>
<text x="772" y="578" class="lbl">download()</text>
<path d="M1035,554 L1035,594" class="lijn" marker-end="url(#pijl)"/>
<text x="1047" y="578" class="lbl">camerademo</text>
<path d="M230,392 H214 V672 H228" class="lijn" marker-end="url(#pijl)"/>
<text x="206" y="532" text-anchor="middle" class="lbl" transform="rotate(-90 206 532)">leest gegevens</text>
<path d="M640,650 L562,650" class="lijn" marker-end="url(#pijl)"/>
<text x="588" y="640" text-anchor="middle" class="lbl">leest</text>
<path d="M395,704 L395,744" class="lijn" marker-end="url(#pijl)"/>
<text x="407" y="728" class="lbl">load() / save()</text>
<path d="M395,822 L395,860" class="lijn" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
<text x="407" y="846" class="lbl">JSON</text>
<path d="M760,704 L760,860" class="lijn" marker-end="url(#pijl)"/>
<text x="772" y="786" class="lbl">downloadt</text>
<path d="M1035,704 L1035,860" class="lijn" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
<text x="1047" y="778" class="lbl">laadt modellen,</text>
<text x="1047" y="795" class="lbl">leest camerabeeld</text>
<path d="M1250,554 L1250,594" class="lijn" marker-end="url(#pijl)"/>
<text x="1238" y="578" text-anchor="end" class="lbl">handleKey()</text>
<path d="M1322,594 L1322,556" class="lijn" marker-end="url(#pijl)"/>
<text x="1334" y="578" class="lbl">onScan()</text>
<path d="M1390,925 H1420 V234 H1052" class="lijn" marker-end="url(#pijl)"/>
<text x="1413" y="760" text-anchor="middle" class="lbl" transform="rotate(-90 1413 760)">typt het pasnummer (als toetsenbord)</text>
<path d="M560,960 H620 V556" class="stip" marker-end="url(#pijl)"/>
<text x="614" y="760" text-anchor="middle" class="lbl" transform="rotate(-90 614 760)">storage-event (ander tabblad)</text>
<!-- main.js en modules zonder class -->
<rect x="1490" y="298" width="250" height="460" rx="12" fill="#e8f2f6" stroke="#176b8b" stroke-width="1.8" class="box"/>
<text x="1615" y="332" text-anchor="middle" font-size="19" class="kop">main.js</text>
<text x="1615" y="354" text-anchor="middle" font-size="13" class="sub">startpunt: maakt alle</text>
<text x="1615" y="372" text-anchor="middle" font-size="13" class="sub">objecten aan en koppelt ze</text>
<text x="1510" y="410" font-size="13" font-weight="700" fill="#176b8b">1</text>
<text x="1528" y="410" font-size="13">new ThemeManager()</text>
<text x="1544" y="428" font-size="13">.initialize()</text>
<text x="1510" y="462" font-size="13" font-weight="700" fill="#176b8b">2</text>
<text x="1528" y="462" font-size="13">new DataStore(STORAGE_KEY)</text>
<text x="1510" y="496" font-size="13" font-weight="700" fill="#176b8b">3</text>
<text x="1528" y="496" font-size="13">new RegistrationModel(store)</text>
<text x="1510" y="530" font-size="13" font-weight="700" fill="#176b8b">4</text>
<text x="1528" y="530" font-size="13">new RegistrationView(model)</text>
<text x="1510" y="564" font-size="13" font-weight="700" fill="#176b8b">5</text>
<text x="1528" y="564" font-size="13">new CsvExport(model)</text>
<text x="1510" y="598" font-size="13" font-weight="700" fill="#176b8b">6</text>
<text x="1528" y="598" font-size="13">new FaceRecognitionDemo()</text>
<text x="1510" y="632" font-size="13" font-weight="700" fill="#176b8b">7</text>
<text x="1528" y="632" font-size="13">new BadgeReader()</text>
<text x="1510" y="666" font-size="13" font-weight="700" fill="#176b8b">8</text>
<text x="1528" y="666" font-size="13">new RegistrationApp(model,</text>
<text x="1544" y="684" font-size="13">view, csvExport, faceDemo,</text>
<text x="1544" y="702" font-size="13">badgeReader)</text>
<text x="1510" y="736" font-size="13" font-weight="700" fill="#176b8b">9</text>
<text x="1528" y="736" font-size="13">app.initialize()</text>
<path d="M1446,312 H1462 V822 H1446" class="stip"/>
<path d="M1488,560 L1464,560" class="stip" marker-end="url(#open)"/>
<rect x="1490" y="862" width="250" height="126" rx="12" fill="#f8fbfa" stroke="#71858a" stroke-width="1.4" class="box"/>
<text x="1615" y="892" text-anchor="middle" font-size="14" class="kop">config.js · ids.js · icons.js</text>
<text x="1615" y="915" text-anchor="middle" font-size="13">vaste waarden, createId()</text>
<text x="1615" y="934" text-anchor="middle" font-size="13">en SVG-iconen, gebruikt</text>
<text x="1615" y="953" text-anchor="middle" font-size="13">door de classes</text>
<!-- Legenda -->
<path d="M40,1040 L90,1040" class="lijn" marker-end="url(#pijl)"/>
