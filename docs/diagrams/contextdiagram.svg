<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Contextdiagram Blikjesregistratie TVB</title>
  <desc id="desc">Medewerker en beheerder gebruiken de webapplicatie op een tablet of pc; de demo bewaart gegevens in localStorage, de camera is optioneel en de CSV gaat naar de loonadministratie. Later vervangen een webserver en een gedeelde SQL-database de localStorage.</desc>
  <defs>
    <style>
      text { font-family: "DM Sans", sans-serif; fill: #163540; }
      .kop { font-family: "Space Grotesk", "DM Sans", sans-serif; font-weight: 700; }
      .sub { fill: #71858a; }
      .lbl { font-size: 13.5px; fill: #71858a; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .lijn { fill: none; stroke: #163540; stroke-width: 1.6; }
      .stip { fill: none; stroke: #163540; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
    <!-- gevulde pijlpunt (aanroep, gegevensstroom) -->
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#163540"/>
    </marker>
    <!-- open pijlpunt (UML: associatie en afhankelijkheid) -->
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#163540" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1500" height="940" fill="#ffffff"/>
<text x="40" y="50" font-size="28" class="kop">Contextdiagram – Blikjesregistratie TVB</text>
<text x="40" y="78" font-size="15" class="sub">Het systeem in zijn omgeving: wie en wat er gegevens mee uitwisselt</text>
<!-- Apparaat met webbrowser -->
<rect x="470" y="110" width="620" height="540" rx="18" fill="#f8fbfa" stroke="#159a72" stroke-width="1.6" stroke-dasharray="8 6" class="box"/>
<text x="490" y="140" font-size="15" font-weight="700" fill="#087252">Tablet of pc met webbrowser</text>
<text x="490" y="160" font-size="13" class="sub">(bij het consumptiepunt of op kantoor)</text>
<!-- Het systeem -->
<rect x="560" y="185" width="440" height="240" rx="16" fill="#e8f5ee" stroke="#159a72" stroke-width="2.2" class="box"/>
<text x="780" y="245" text-anchor="middle" font-size="26" class="kop">Blikjesregistratie TVB</text>
<text x="780" y="282" text-anchor="middle" font-size="15">webapplicatie: HTML, CSS en JavaScript</text>
<text x="780" y="306" text-anchor="middle" font-size="15">medewerkersscherm en beheerscherm</text>
<text x="780" y="330" text-anchor="middle" font-size="15">draait volledig in de browser</text>
<rect x="715" y="375" width="130" height="28" rx="14" fill="#159a72"/>
<text x="780" y="394" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">demoversie</text>
<!-- Medewerker en beheerder -->
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="110" cy="183" r="13" fill="#e8f5ee"/>
    <path d="M110,196 V232 M86,208 H134 M110,232 L92,260 M110,232 L128,260"/>
  </g>
  <text x="110" y="284" text-anchor="middle" font-size="16" class="kop">Medewerker</text>
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="110" cy="343" r="13" fill="#e8f5ee"/>
    <path d="M110,356 V392 M86,368 H134 M110,392 L92,420 M110,392 L128,420"/>
  </g>
  <text x="110" y="444" text-anchor="middle" font-size="16" class="kop">Beheerder</text>
<path d="M150,205 L558,205" class="lijn" marker-end="url(#pijl)"/>
<text x="165" y="196" font-size="14" class="lbl">naam, producten en aantallen</text>
<path d="M558,255 L150,255" class="lijn" marker-end="url(#pijl)"/>
<text x="158" y="246" font-size="14" class="lbl">bevestiging en dag-/maandtotaal van iedereen</text>
<path d="M150,365 L558,365" class="lijn" marker-end="url(#pijl)"/>
<text x="165" y="356" font-size="14" class="lbl">inloggen, beheer, correcties, voorraad</text>
<path d="M558,415 L150,415" class="lijn" marker-end="url(#pijl)"/>
<text x="165" y="406" font-size="14" class="lbl">overzichten, logboek, CSV-bestand</text>
<!-- Opslag en camera in het apparaat -->
<g class="box">
    <path d="M560,512 V613 A100,12 0 0 0 760,613 V512" fill="#e8f5ee" stroke="#159a72" stroke-width="1.8"/>
    <ellipse cx="660" cy="512" rx="100" ry="12" fill="#e8f5ee" stroke="#159a72" stroke-width="1.8"/>
  </g>
<text x="660" y="556" text-anchor="middle" font-size="17" class="kop">localStorage</text>
<text x="660" y="579" text-anchor="middle" font-size="13">opslag in de browser</text>
<text x="660" y="597" text-anchor="middle" font-size="13">(alleen deze demo)</text>
<path d="M660,427 L660,498" class="lijn" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
<text x="672" y="468" font-size="13" class="lbl">opslaan en laden (JSON)</text>
<rect x="800" y="500" width="200" height="125" rx="12" fill="#e8f2f6" stroke="#176b8b" stroke-width="1.8" class="box"/>
<text x="900" y="538" text-anchor="middle" font-size="17" class="kop">Camera</text>
<text x="900" y="562" text-anchor="middle" font-size="13">alleen voor de demo</text>
<text x="900" y="580" text-anchor="middle" font-size="13">gezichtsherkenning</text>
<text x="900" y="598" text-anchor="middle" font-size="13">(optioneel)</text>
<path d="M900,498 L900,427" class="lijn" marker-end="url(#pijl)"/>
<text x="912" y="468" font-size="13" class="lbl">beeld</text>
<!-- Loonadministratie -->
<rect x="1240" y="225" width="230" height="130" rx="14" fill="#fdf1e7" stroke="#a55a16" stroke-width="1.6" class="box"/>
<text x="1355" y="268" text-anchor="middle" font-size="18" class="kop">Loonadministratie</text>
<text x="1355" y="294" text-anchor="middle" font-size="14">Excel of salarispakket</text>
<text x="1355" y="314" text-anchor="middle" font-size="14">(maandelijkse inhouding)</text>
<path d="M1002,290 L1238,290" class="lijn" marker-end="url(#pijl)"/>
<text x="1165" y="314" text-anchor="middle" font-size="13" class="lbl">CSV-download</text>
<text x="1165" y="331" text-anchor="middle" font-size="13" class="lbl">per loonmaand</text>
<text x="1165" y="348" text-anchor="middle" font-size="13" class="lbl">door de beheerder</text>
<!-- Productieversie (later) -->
<rect x="470" y="680" width="1000" height="230" rx="18" fill="none" stroke="#71858a" stroke-width="1.4" stroke-dasharray="8 6"/>
<text x="490" y="893" font-size="14" font-weight="700" fill="#71858a">Productieversie (later; techniek nog te kiezen)</text>
<rect x="700" y="725" width="260" height="110" rx="12" fill="#ffffff" stroke="#71858a" stroke-width="1.6" stroke-dasharray="6 4" class="box"/>
<text x="830" y="763" text-anchor="middle" font-size="17" class="kop">Webserver</text>
<text x="830" y="787" text-anchor="middle" font-size="13">backend en API</text>
<text x="830" y="806" text-anchor="middle" font-size="13">(inloggen, opslag, CSV)</text>
<g class="box">
    <path d="M1040,730 V836 A110,12 0 0 0 1260,836 V730" fill="#ffffff" stroke="#71858a" stroke-width="1.8" stroke-dasharray="6 4"/>
    <ellipse cx="1150" cy="730" rx="110" ry="12" fill="#ffffff" stroke="#71858a" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
<text x="1150" y="776" text-anchor="middle" font-size="15" class="kop">Gedeelde SQL-database</text>
<text x="1150" y="798" text-anchor="middle" font-size="13">DATABASE-SCHEMA.sql</text>
<text x="1150" y="816" text-anchor="middle" font-size="13">(PostgreSQL)</text>
<g class="actor" stroke="#163540" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="1385" cy="735" r="13" fill="#e8f5ee"/>
    <path d="M1385,748 V784 M1361,760 H1409 M1385,784 L1367,812 M1385,784 L1403,812"/>
  </g>
  <text x="1385" y="836" text-anchor="middle" font-size="16" class="kop">Systeembeheerder</text>
<path d="M830,652 V723" class="stip" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
<text x="842" y="706" font-size="13" class="lbl">HTTPS (productie)</text>
<path d="M660,627 V780 H698" class="stip" marker-end="url(#pijl)"/>
<text x="648" y="722" text-anchor="end" font-size="13" class="lbl">in productie</text>
<text x="648" y="739" text-anchor="end" font-size="13" class="lbl">vervangen door</text>
<path d="M962,783 L1038,783" class="lijn" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
<text x="1000" y="773" text-anchor="middle" font-size="13" class="lbl">SQL</text>
<path d="M1350,783 L1262,783" class="lijn" marker-end="url(#pijl)"/>
<text x="1306" y="773" text-anchor="middle" font-size="13" class="lbl">beheer</text>
</svg>
