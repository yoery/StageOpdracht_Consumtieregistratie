# Apache-instellingen voor de Consumptieregistratie.
ServerTokens Prod
ServerSignature Off
ServerName localhost

<Directory /var/www/html>
    # Geen .htaccess: alle regels staan hier, zodat een bestand in de map ze niet kan veranderen.
    AllowOverride None
    # Geen overzicht van mappen tonen.
    Options -Indexes
    Require all granted
    # Kwam een verzoek via de proxy zonder HTTPS binnen, dan naar hetzelfde adres met HTTPS (security
    # audit 26 november 2026, AF-03). Hier en niet op het niveau van de server: daar neemt de
    # standaardsite van de container de regels niet over. De API weigert zelf ook verzoeken zonder HTTPS.
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =http
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</Directory>

# Bestanden die met een punt beginnen (zoals .env of .git) worden nooit uitgeleverd. Ze staan ook
# niet in de container, maar zo blijft dat waar als er later iets wordt toegevoegd.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>

# Alle adressen onder /api gaan naar het ene PHP-bestand van de API.
<Directory /var/www/html/api>
    FallbackResource /api/index.php
</Directory>

# Buiten /api wordt geen PHP uitgevoerd: de website zelf bestaat alleen uit vaste bestanden.
<Directory /var/www/html/assets>
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Beveiligingsheaders: niet in een frame van een andere site, geen verwijzer naar buiten, het
# soort bestand niet raden. De camera mag alleen door de website zelf worden gebruikt.
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"

# Coolify zet er een proxy met HTTPS voor. PHP moet dan weten dat het verzoek via HTTPS kwam, en
# de browser hoort dat hij deze site een jaar lang alleen via HTTPS mag openen.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS

# De pagina en de code van de website niet lang bewaren in de browser: na een nieuwe versie haalt
# de tablet ze opnieuw op. Antwoorden van de API worden nooit bewaard (dat zet de API zelf).
<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache"
</FilesMatch>

# In het logboek van Apache staan geen cookies, geen inhoud van verzoeken, geen vraagteken-deel van het
# adres (%U is alleen het pad), geen verwijzer en geen browser. De standaardsite van de container
# gebruikt dit formaat (zie de Dockerfile), en logt naar de uitvoer van de container.
LogFormat "%h %t \"%m %U\" %>s %b" consumptie
