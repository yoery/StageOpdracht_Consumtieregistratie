; PHP-instellingen voor de container.
; Een verzoek aan de API is hooguit 4 MB (Request::MAX_BODY_BYTES).
post_max_size = 5M
upload_max_filesize = 1M
file_uploads = Off
memory_limit = 256M
; Foutmeldingen alleen in het logboek van de container (docker logs of de logs in Coolify), nooit
; in de browser. Een melding bevat nooit de waarde van een argument (zoals een wachtwoord of token).
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On
expose_php = Off
; Een cookie van PHP zelf wordt niet gebruikt. De API zet zijn eigen cookies (HttpOnly, SameSite=Strict).
session.use_strict_mode = 1
date.timezone = UTC
