name: CI

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]
  workflow_dispatch:

# Beveiliging: de workflow mag de code alleen lezen (geen schrijfrechten op de repository).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # De actions staan vast op een commit-SHA in plaats van op een tag (v4). Een tag kan later
      # naar andere code wijzen; een SHA niet. Bij bijwerken: nieuwe SHA opzoeken en het
      # versienummer in de opmerking erachter aanpassen.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bewaar het GitHub-token niet in de map; de tests hebben het niet nodig.
          persist-credentials: false

      # Node.js 24 is een LTS-versie die nog wordt onderhouden. Node.js 20 kreeg op 30 april 2026
      # zijn laatste update (end-of-life). Houd dit gelijk aan "engines" in package.json.
      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Controleer Node versie
        run: |
          node -v
          npm -v

      - name: Unit tests uitvoeren
        run: npm test

  # Browsertests (end-to-end): de echte pagina in headless Google Chrome, aangestuurd via het
  # Chrome DevTools Protocol (zie tests/e2e/browser.js). Er worden geen npm-pakketten geïnstalleerd;
  # Chrome staat al op de runner (ubuntu-latest). Deze job start pas als de unit tests geslaagd zijn.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Vast pad naar de browser die op de runner staat.
      BROWSER_PATH: /usr/bin/google-chrome
      # De tests zetten de tijdzone van de browser zelf op Europe/Amsterdam. Node krijgt dezelfde
      # tijdzone, zodat de uitkomst niet afhangt van de tijdzone van de runner (UTC).
      TZ: Europe/Amsterdam

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Controleer Node- en Chrome-versie
        run: |
          node -v
          "$BROWSER_PATH" --version

      - name: Browsertests uitvoeren
        run: npm run test:e2e
