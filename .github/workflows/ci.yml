name: CI

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]
  workflow_dispatch:

# Beveiliging: de workflow mag de code alleen lezen (geen schrijfrechten op de repository).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # De actions staan vast op een commit-SHA in plaats van op een tag (v4). Een tag kan later
      # naar andere code wijzen; een SHA niet. Bij bijwerken: nieuwe SHA opzoeken en het
      # versienummer in de opmerking erachter aanpassen.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bewaar het GitHub-token niet in de map; de tests hebben het niet nodig.
          persist-credentials: false

      # Node.js 24 is een LTS-versie die nog wordt onderhouden. Node.js 20 kreeg op 30 april 2026
      # zijn laatste update (end-of-life). Houd dit gelijk aan "engines" in package.json.
      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Controleer Node versie
        run: |
          node -v
          npm -v

      - name: Unit tests uitvoeren
        run: npm test

  # Tests van de backend (de koppeling met AFAS in PHP, map backend/). PHP staat al op de runner en
  # de tests hebben geen pakketten nodig. Er gaat geen verzoek naar AFAS: de antwoorden zijn
  # nagebootst en het token in de tests is een neptoken. Er zijn hier geen geheimen ingesteld.
  backend:
    # Vast op Ubuntu 24.04, net als de browsertests. Daar staat PHP 8.3.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Controleer PHP-versie
        run: php -v

      - name: Tests van de backend uitvoeren
        run: php backend/tests/run.php

  # Browsertests (end-to-end): de echte pagina in headless Google Chrome, aangestuurd via het
  # Chrome DevTools Protocol (zie tests/e2e/browser.js). Er worden geen npm-pakketten geïnstalleerd;
  # Chrome staat al op de runner (ubuntu-latest). Deze job start pas als de unit tests geslaagd zijn.
  e2e:
    needs: test
    # Vast op Ubuntu 24.04. Vanaf 19 oktober 2026 schuift ubuntu-latest geleidelijk door naar
    # Ubuntu 26. Sinds 21 oktober faalden de browsertests daar ook bij een commit die alleen het TO
    # veranderde, terwijl dezelfde code een kwartier eerder nog slaagde. Weer ubuntu-latest gebruiken
    # zodra duidelijk is wat er op Ubuntu 26 anders is (Chrome-versie, sandbox of lettertypes).
    runs-on: ubuntu-24.04
    # Ruim genomen: op een drukke runner duren de browsertests veel langer dan op een laptop.
    timeout-minutes: 15
    env:
      # Vast pad naar de browser die op de runner staat.
      BROWSER_PATH: /usr/bin/google-chrome
      # De tests zetten de tijdzone van de browser zelf op Europe/Amsterdam. Node krijgt dezelfde
      # tijdzone, zodat de uitkomst niet afhangt van de tijdzone van de runner (UTC).
      TZ: Europe/Amsterdam

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Node.js instellen
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Controleer Node- en Chrome-versie
        run: |
          node -v
          "$BROWSER_PATH" --version

      - name: Browsertests uitvoeren
        run: npm run test:e2e

      # Mislukt een browsertest, dan maakt tests/e2e/browser.js per scenario een schermafdruk in
      # test-results/e2e. Die map wordt alleen bij een fout als artifact bewaard (7 dagen), te
      # downloaden onder "Artifacts" op de pagina van de run. De foutuitvoer van de tests zelf noemt
      # het scenario, de toestand van de pagina en de laatste meldingen uit de console.
      - name: Schermafdrukken bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-schermafdrukken
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # De container voor Coolify (Dockerfile): bouwen en kort controleren. Er zijn hier geen geheimen
  # ingesteld. De test maakt zelf een .env met een nepgeheim en kijkt of dat NIET in de container
  # terechtkomt, of de website en de API antwoorden, en of zonder inloggen niets te lezen is.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Nepgeheim klaarzetten en de container bouwen
        run: |
          printf 'AFAS_TOKEN=NEPGEHEIM-IN-ENV\n' > .env
          docker build -t consumptieregistratie:test .

      - name: Geen .env, tests of documenten in de container
        run: |
          docker run --rm --entrypoint sh consumptieregistratie:test -c '
            set -e
            if find /var/www /data /tmp /root /etc/apache2 \( -name ".env" -o -name ".env.*" -o -name "*.test.js" -o -name "*Test.php" \) 2>/dev/null | grep -q .; then echo "Er staat een .env of testbestand in de container"; exit 1; fi
            if grep -rl "NEPGEHEIM-IN-ENV" /var/www /usr/local/etc /etc/apache2 2>/dev/null | grep -q .; then echo "Het nepgeheim staat in de container"; exit 1; fi
            test ! -e /var/www/html/backend
            test ! -e /var/www/html/docs
            grep -q "/api" /var/www/html/assets/js/deployment.js
          '

      - name: Container starten en controleren
        env:
          NEP_WACHTWOORD: een-lang-nepwachtwoord-voor-ci
        run: |
          docker run -d --name cr -p 127.0.0.1:8080:80 \
            -e CR_BEHEER_EMAIL=beheer@voorbeeld.test -e CR_BEHEER_WACHTWOORD="$NEP_WACHTWOORD" \
            consumptieregistratie:test
          for poging in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && break; sleep 1; done
          status() { curl -s -o /dev/null -w '%{http_code}' --path-as-is "$@"; }
          test "$(status http://127.0.0.1:8080/api/health)" = 200
          test "$(status http://127.0.0.1:8080/)" = 200
          test "$(status http://127.0.0.1:8080/assets/js/main.js)" = 200
          test "$(status http://127.0.0.1:8080/api/changes?since=0)" = 401
          test "$(status http://127.0.0.1:8080/api/devices)" = 401
          for pad in /.env /.git/config /backend/src/Server/Api.php /api/../.env /assets/../.env /docker/start.sh /Dockerfile; do
            code="$(status "http://127.0.0.1:8080$pad")"
            case "$code" in 400|403|404) ;; *) echo "$pad geeft $code"; exit 1 ;; esac
          done
          # Inloggen met de nepbeheerder: lukt alleen van de eigen website, en de cookie is HttpOnly.
          test "$(status -X POST -H 'Content-Type: application/json' -d '{"email":"beheer@voorbeeld.test","password":"'"$NEP_WACHTWOORD"'"}' http://127.0.0.1:8080/api/login)" = 403
          curl -s -D kop.txt -o antwoord.json -X POST -H 'Origin: http://127.0.0.1:8080' -H 'X-CR-Client: 1' -H 'Content-Type: application/json' \
            -d '{"email":"beheer@voorbeeld.test","password":"'"$NEP_WACHTWOORD"'"}' http://127.0.0.1:8080/api/login
          grep -qi '^set-cookie: cr_beheer=.*httponly' kop.txt
          grep -qi 'samesite=strict' kop.txt
          grep -q '"role":"admin"' antwoord.json
          # De beveiligingsheaders van Apache.
          curl -s -D kop2.txt -o /dev/null http://127.0.0.1:8080/
          grep -qi '^x-frame-options: DENY' kop2.txt
          grep -qi '^x-content-type-options: nosniff' kop2.txt
          # Het wachtwoord staat nergens in het logboek van de container.
          if docker logs cr 2>&1 | grep -q "$NEP_WACHTWOORD"; then echo "Het wachtwoord staat in het logboek"; exit 1; fi
          docker logs cr 2>&1 | tail -20

      - name: Container stoppen
        if: always()
        run: docker rm -f cr >/dev/null 2>&1 || true
